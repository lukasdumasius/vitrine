name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      app_name:
        description: "Display name on the home screen"
        default: Muzika
        type: string
      bundle_id:
        description: "Bundle identifier (leave empty to keep com.spotify.client)"
        default: com.dev.muzika
        type: string
      app_icon:
        description: "App icon on the home screen"
        default: icons/Muzika.png
        type: choice
        options:
          - icons/Muzika.png
          - docs/icon.png
          - none
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid uv
          uv tool install --force --with pillow "cyan @ git+https://github.com/asdfzxcvbn/pyzule-rw"

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - name: Build IPA
        run: >-
          BUNDLE_ID="${{ inputs.bundle_id }}"
          ./scripts/pipeline.sh ipa/spotify.ipa --no-flex
          --name "${{ inputs.app_name }}"
          ${{ inputs.app_icon != 'none' && format('--icon "{0}"', inputs.app_icon) || '' }}

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: muzika.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
